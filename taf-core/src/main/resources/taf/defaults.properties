# Framework defaults. Override in src/test/resources/taf.properties, env/<env>.properties,
# -Dkey=value or environment variables (KEY_IN_UPPER_SNAKE_CASE).

# --- HTTP ---------------------------------------------------------------------------
http.connect-timeout=10s
http.read-timeout=30s
# extra headers hidden in Allure attachments (Authorization, Cookie, X-API-Key are always hidden)
http.masked-headers=

# --- Verification -------------------------------------------------------------------
# hard: first failed Verify stops the test | soft: collect all failures, report at the end
verify.mode=hard

# --- Retry: only infrastructure failures, never assertions ----------------------------
retry.max=1
retry.on=io.github.alexxfromgit.taf.contract.core.failure.EnvironmentException,\
  java.net.ConnectException,\
  java.net.SocketTimeoutException,\
  java.net.UnknownHostException,\
  org.apache.http.NoHttpResponseException,\
  org.apache.http.conn.ConnectTimeoutException

# --- Contracts ----------------------------------------------------------------------
# off | missing | overwrite  (see RecordMode)
contract.record=off
contract.schema.format-assertions=true
contract.drift.enabled=true
contract.drift.fail=false
contract.coverage.fail-under=0
# OpenAPI validator message levels (ERROR fails the call, WARN/INFO are attached, IGNORE drops).
# Undeclared response fields are additions, not breaking changes: report them (drift) instead of failing.
contract.openapi.level.validation.response.body.schema.additionalProperties=WARN

# --- Embedded stub server -----------------------------------------------------------
stub.enabled=false
stub.port=0
stub.root=wiremock

# --- Lint ---------------------------------------------------------------------------
lint.require-owner=true
lint.require-feature=true
lint.secrets=true
lint.quarantine.max-days=90

taf.secrets-guard.enabled=true
