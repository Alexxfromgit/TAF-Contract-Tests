# Project configuration. Environment-specific values live in env/<env>.properties (select with -Denv=...).
# Secrets never go here: use environment variables (see docs/configuration.md).
env=stub

# --- Swagger Petstore (REST) ------------------------------------------------------------
# Snapshot of https://petstore3.swagger.io/api/v3/openapi.json - enables OpenAPI validation and API coverage
services.petstore.openapi=classpath:openapi/petstore-openapi.json

# The public Petstore does not enforce its declared api_key/OAuth security, so missing credentials
# are not a contract violation for this demo. Any validator message key can be tuned like this.
contract.openapi.level.validation.request.security.missing=IGNORE

# --- Countries (GraphQL) ----------------------------------------------------------------
services.countries.graphql-path=/graphql

# --- OAuth2-protected demo API (stub only) ----------------------------------------------
services.secure-api.auth.type=oauth2
services.secure-api.auth.client-id=demo-client
services.secure-api.auth.scope=profile:read
